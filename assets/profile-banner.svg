<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Gabriel Saraiva - Full Stack Developer</title>
  <desc id="description">Dark blue developer profile banner with connected interface, API, and data layers.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="24" x2="1120" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426" />
      <stop offset="0.52" stop-color="#0A2342" />
      <stop offset="1" stop-color="#11123A" />
    </linearGradient>
    <linearGradient id="accent" x1="110" y1="106" x2="610" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163A5F" stop-opacity="0.95" />
      <stop offset="1" stop-color="#111C44" stop-opacity="0.88" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />

  <circle cx="1115" cy="70" r="150" fill="#7C3AED" fill-opacity="0.08" />
  <circle cx="1010" cy="315" r="180" fill="#06B6D4" fill-opacity="0.07" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="78" fill="#67E8F9" font-size="15" font-weight="700" letter-spacing="4">FULL STACK DEVELOPER</text>
    <rect x="72" y="100" width="490" height="4" rx="2" fill="url(#accent)" />
    <text x="72" y="174" fill="#F8FAFC" font-size="58" font-weight="750" letter-spacing="-1.5">Gabriel Saraiva</text>
    <text x="75" y="218" fill="#CBD5E1" font-size="22" font-weight="450">Building reliable SaaS products, end to end.</text>

    <g transform="translate(74 263)">
      <rect width="142" height="36" rx="18" fill="#0E7490" fill-opacity="0.28" stroke="#22D3EE" stroke-opacity="0.55" />
      <circle cx="19" cy="18" r="5" fill="#22D3EE" filter="url(#glow)" />
      <text x="34" y="23" fill="#CFFAFE" font-size="14" font-weight="650">TypeScript</text>
    </g>
    <g transform="translate(228 263)">
      <rect width="112" height="36" rx="18" fill="#0E7490" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.45" />
      <circle cx="19" cy="18" r="5" fill="#38BDF8" />
      <text x="34" y="23" fill="#E0F2FE" font-size="14" font-weight="650">React</text>
    </g>
    <g transform="translate(352 263)">
      <rect width="126" height="36" rx="18" fill="#5B21B6" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.5" />
      <circle cx="19" cy="18" r="5" fill="#A78BFA" />
      <text x="34" y="23" fill="#EDE9FE" font-size="14" font-weight="650">Node.js</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M890 112 L890 151" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 6" />
    <path d="M890 209 L890 248" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 6" />

    <g transform="translate(720 54)">
      <rect width="340" height="72" rx="16" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.5" />
      <rect x="20" y="20" width="32" height="32" rx="9" fill="#0E7490" />
      <path d="M30 31H42M30 37H39M30 43H35" stroke="#CFFAFE" stroke-width="2" stroke-linecap="round" />
      <text x="70" y="32" fill="#F8FAFC" font-size="16" font-weight="700">INTERFACE</text>
      <text x="70" y="53" fill="#94A3B8" font-size="13">React · Next.js · Angular</text>
    </g>

    <g transform="translate(720 151)">
      <rect width="340" height="72" rx="16" fill="url(#card)" stroke="#818CF8" stroke-opacity="0.48" />
      <rect x="20" y="20" width="32" height="32" rx="9" fill="#3730A3" />
      <path d="M29 36H43M34 30L28 36L34 42M38 30L44 36L38 42" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="70" y="32" fill="#F8FAFC" font-size="16" font-weight="700">API &amp; SERVICES</text>
      <text x="70" y="53" fill="#94A3B8" font-size="13">Node.js · NestJS · WebSockets</text>
    </g>

    <g transform="translate(720 248)">
      <rect width="340" height="72" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.48" />
      <rect x="20" y="20" width="32" height="32" rx="9" fill="#5B21B6" />
      <ellipse cx="36" cy="29" rx="9" ry="4" stroke="#EDE9FE" stroke-width="2" />
      <path d="M27 29V42C27 44.2 31 46 36 46C41 46 45 44.2 45 42V29M27 35.5C27 37.7 31 39.5 36 39.5C41 39.5 45 37.7 45 35.5" stroke="#EDE9FE" stroke-width="2" />
      <text x="70" y="32" fill="#F8FAFC" font-size="16" font-weight="700">DATA &amp; CLOUD</text>
      <text x="70" y="53" fill="#94A3B8" font-size="13">PostgreSQL · Prisma · AWS</text>
    </g>
  </g>

  <circle cx="1136" cy="180" r="4" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="1100" cy="210" r="3" fill="#A78BFA" />
  <circle cx="1154" cy="238" r="2.5" fill="#38BDF8" />
</svg>
